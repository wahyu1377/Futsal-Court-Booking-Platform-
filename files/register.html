<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrasi - Arena Sport</title>
</head>
<body>
<header><a href="beranda.html"><img src="./assets/images/logo.png" alt="Arena Sport" width="120"></a></header>
<main>
<span>● PENDAFTARAN ATLET BARU</span>
<h1>Daftar Akun Baru</h1>
<p>Lengkapi data diri Anda untuk mulai reservasi lapangan.</p>
<form action="login.html" method="get">
  <fieldset>
    <legend>Data Pendaftaran</legend>
    <p><label for="nama">Nama Lengkap</label><br><input type="text" id="nama" name="nama" placeholder="Bambang Pamungkas" required></p>
    <p><label for="email">Email atau Nomor HP</label><br><input type="text" id="email" name="email" placeholder="atlet@arenasport.id" required></p>
    <p><label for="pw">Kata Sandi</label><br><input type="password" id="pw" name="password" minlength="8" placeholder="Minimal 8 karakter aman" required></p>
    <p><label for="pw2">Konfirmasi Kata Sandi</label><br><input type="password" id="pw2" name="password2" placeholder="Ulangi kata sandi Anda" required></p>
    <p><input type="checkbox" id="setuju" required> <label for="setuju">Saya setuju dengan <a href="#">Syarat &amp; Ketentuan</a> serta <a href="#">Kebijakan Privasi</a> Arena Sport.</label></p>
  </fieldset>
  <button type="submit">Daftar Sekarang →</button>
  <p>atau daftar lebih cepat dengan</p>
  <button type="button">Google</button>
</form>
<p>Sudah punya akun? <a href="login.html"><strong>Masuk di sini</strong></a></p>
<small>🔒 ENKRIPSI STANDAR ARENA SPORT 256-BIT SSL</small>
</main>

</footer>
</body>
</html>
